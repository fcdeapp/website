<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MDEET Question Dataset Preview</title>
<style>body{margin:0;background:#f5f5f8;color:#23232c;font:14px system-ui,sans-serif}main{max-width:1050px;margin:32px auto;padding:0 16px}h1{font-size:23px}header,p{line-height:1.5}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}select,button{border:1px solid #d4d2de;border-radius:6px;background:white;padding:9px;font:inherit;color:inherit}button{cursor:pointer}article{background:white;border:1px solid #dedce6;border-radius:8px;padding:18px}#paper{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:14px;align-items:start}svg{width:100%;height:auto;border:1px solid #efedf2;background:white}#choices{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}.selected{border-color:#7564a0;background:#e9e3f5}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.6 system-ui}small{color:#737080}</style></head><body><main><h1>MDEET / Question Dataset</h1><p>2023–2027학년도 · 문항별 JSON 및 그림 분리 데이터 테스트</p>
<div class="toolbar"><select id="year"><option value="">전체 학년도</option></select><select id="subject"><option value="">전체 과목</option><option value="biology">생물학</option><option value="chemistry">화학</option></select><select id="unit"><option value="">전체 단원</option></select><select id="question"></select><button id="prev">이전</button><button id="next">다음</button></div>
<article><h2 id="title"></h2><small id="meta"></small><div id="paper"></div><div id="choices"></div><p id="result"></p><button id="reveal">정답 확인</button><details><summary>검색용 원문 텍스트 및 데이터 확인</summary><pre id="plain"></pre><a id="json">문항 JSON 열기</a></details></article><p><small>자동 추출 미리보기입니다. 화학 수식, 그림과 주제 분류는 공개 배포 전 원본 대조가 필요합니다.</small></p></main>
<script>
const $=id=>document.getElementById(id),ns='http://www.w3.org/2000/svg';
const el=(tag,attrs)=>{const e=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,String(v));return e};
let all=[],filtered=[],current=null,choice=null,loadToken=0;
const add=(select,value,text)=>select.add(new Option(text,value));
function unitList(){const sub=$('subject').value,yr=$('year').value,prev=$('unit').value;let candidates=all.filter(q=>(!sub||q.subject===sub)&&(!yr||String(q.year)===yr));$('unit').replaceChildren(new Option('전체 단원',''));let m=new Map(candidates.map(q=>[q.unitId,q.unitLabel]));for(const [k,v] of [...m].sort((a,b)=>a[1].localeCompare(b[1],'ko')))add($('unit'),k,v);if(m.has(prev))$('unit').value=prev}
function filter(){const old=$('question').value;filtered=all.filter(q=>(!$('year').value||String(q.year)===$('year').value)&&(!$('subject').value||q.subject===$('subject').value)&&(!$('unit').value||q.unitId===$('unit').value));$('question').replaceChildren();for(const q of filtered)add($('question'),q.id,`${q.year} · ${q.subject==='biology'?'생물':'화학'} ${q.number}번 · ${q.topic}`);if(filtered.some(q=>q.id===old))$('question').value=old;if(filtered.length)load();else{$('title').textContent='해당 문항 없음';$('paper').replaceChildren();$('choices').replaceChildren()}}
function render(q){$('title').textContent=`${q.year}학년도 · ${q.subject==='biology'?'생물학':'화학'} ${q.number}번`; $('meta').textContent=`${q.unitLabel} / ${q.topic} · ${q.points}점 · ${q.id}`;$('paper').replaceChildren();const assets=new Map(q.assets.map(a=>[a.id,a]));
for(const r of q.layout){const svg=el('svg',{viewBox:`0 0 ${r.width} ${r.height}`,role:'img','aria-label':`문항 ${q.number} 원본 배치`});for(const i of r.items.filter(i=>i.type==='image')){const [x,y,width,height]=i.bbox;const a=assets.get(i.assetId);if(a)svg.append(el('image',{x,y,width,height,href:a.src,preserveAspectRatio:'none'}))}
for(const i of r.items.filter(i=>i.type==='text'))for(const s of i.spans){if(!s.text.trim())continue;const [x,y]=s.origin;let font=/HyhwpEQ|Symbol/i.test(s.font)?'Times New Roman, serif':'Noto Serif KR, Batang, AppleMyungjo, serif';let a={x,y,'font-size':s.size,'font-family':font,fill:'#111','xml:space':'preserve'};if(s.flags&2)a['font-style']='italic';if(s.flags&16)a['font-weight']='bold';if(s.bbox[2]>0){a.textLength=s.bbox[2];a.lengthAdjust='spacingAndGlyphs'}const t=el('text',a);t.textContent=s.text;svg.append(t)}$('paper').append(svg)}
$('choices').replaceChildren();choice=null;$('result').textContent='';for(const op of q.options){const b=document.createElement('button');b.textContent=String(op.number)+'번';b.onclick=()=>{choice=op.number;for(const x of $('choices').children)x.classList.remove('selected');b.classList.add('selected');$('result').textContent=''};$('choices').append(b)}$('plain').textContent=q.stem+'\n\n'+q.options.map(o=>o.number+'. '+(o.text||'[그림 선지]')).join('\n');$('json').href='/mdeet/questions/'+q.id+'.json'}
async function load(){let q=filtered.find(q=>q.id===$('question').value);if(!q)return;let token=++loadToken;try{const data=await (await fetch(q.url)).json();if(token!==loadToken)return;current=data;render(data)}catch(e){$('title').textContent='문항 로드 오류: '+e.message}}
$('reveal').onclick=()=>{if(current)$('result').textContent=(choice===null?'':choice===current.answer?'정답입니다. ':'오답입니다. ')+'정답: '+current.answer+'번'};
$('year').onchange=()=>{unitList();filter()};$('subject').onchange=()=>{unitList();filter()};$('unit').onchange=filter;$('question').onchange=load;
$('prev').onclick=()=>{if($('question').selectedIndex>0){$('question').selectedIndex--;load()}};$('next').onclick=()=>{if($('question').selectedIndex<filtered.length-1){$('question').selectedIndex++;load()}};
(async()=>{try{all=(await (await fetch('/mdeet/index.json')).json()).questions;for(const y of [...new Set(all.map(q=>q.year))])add($('year'),y,y+'학년도');unitList();filter()}catch(e){$('title').textContent='인덱스 로드 실패: '+e.message}})();
</script></body></html>
