<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MDEET 학습 교과서</title><style>*{box-sizing:border-box}body{margin:0;color:#242424;background:#fbfbfa;font:15px/1.75 system-ui,sans-serif}header{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;padding:12px 24px;z-index:2;display:flex;justify-content:space-between;align-items:center}header a{color:#676273}main{max-width:1360px;margin:auto;display:grid;grid-template-columns:290px minmax(0,1fr)}aside{border-right:1px solid #e1e1e1;position:sticky;top:55px;max-height:calc(100vh - 55px);overflow:auto;padding:20px 16px}article{max-width:850px;padding:30px 40px 70px}h1{font-size:28px;line-height:1.35;margin:0 0 12px}h2{font-size:19px;margin-top:28px}h3{font-size:13px;color:#666;margin:18px 0 6px}button,select,input{font:inherit}input,select{width:100%;padding:8px;border:1px solid #ccc;background:white;border-radius:4px;margin:5px 0}button.nav{display:block;text-align:left;width:100%;background:none;border:0;padding:7px 8px;cursor:pointer;line-height:1.4;color:#444}button.nav.active{background:#ebe8ee;color:#5d4b75;font-weight:600}button.nav:hover{background:#efefef}small,.meta{color:#666;font-size:13px}p{margin:0 0 16px}ul{padding-left:23px}table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:8px;text-align:left;border-bottom:1px solid #ddd;vertical-align:top}th{background:#f0f0ef}div.table{overflow:auto;margin:16px 0}details{border-bottom:1px solid #ddd;padding:10px 0}summary{cursor:pointer}.warning{border-left:3px solid #9b875e;padding:5px 12px;font-size:13px;margin-bottom:20px;color:#62563e}.links{display:flex;flex-wrap:wrap;gap:8px}a{color:#5d4b75}@media(max-width:700px){main{display:block}aside{position:static;max-height:40vh;border-right:0;border-bottom:1px solid #ddd}article{padding:24px 16px}header{padding:10px 16px}}</style></head><body><header><strong>MDEET / 학습 교과서</strong><a href="../preview.html">기출문제 보기</a></header><main><aside><input id="search" placeholder="개념·단원 검색" aria-label="개념·단원 검색"><select id="book" aria-label="과목 선택"></select><div id="nav"></div></aside><article id="content">학습 데이터를 불러오는 중입니다.</article></main><script>
const $=x=>document.getElementById(x);let data,active='',token=0;const node=(tag,text,parent)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(parent)parent.append(e);return e};async function get(url){const r=await fetch(url);if(!r.ok)throw Error(r.status);return r.json()}function nav(){const root=$('nav');root.replaceChildren();const q=$('search').value.trim().toLowerCase();const book=$('book').value;for(const c of data.chapters.filter(c=>!book||c.book===book)){const ss=data.sections.filter(s=>s.unitId===c.id&&(!q||[s.title,c.title,...s.keywords].join(' ').toLowerCase().includes(q)));if(!ss.length)continue;node('h3',c.title,root);for(const s of ss){const b=node('button',s.title,root);b.className='nav'+(active===s.id?' active':'');b.onclick=()=>openSection(s)}}}async function openSection(s){const t=++token;active=s.id;nav();const a=$('content');a.textContent='불러오는 중…';try{const x=await get(s.url);if(t!==token)return;a.replaceChildren();node('div','교과서 초안 · 독립 검수 전 · '+x.scope,a).className='warning';node('h1',x.title,a);node('p',x.keywords.join(' · '),a).className='meta';for(const b of x.blocks){if(b.type==='paragraph')node('p',b.text,a);if(b.type==='keyFacts'){node('h2','주요 기억 사항',a);const ul=node('ul',undefined,a);for(const v of b.items)node('li',v,ul)}if(b.type==='table'){node('h2',b.title,a);const w=node('div',undefined,a);w.className='table';const tab=node('table',undefined,w);const tr=node('tr',undefined,node('thead',undefined,tab));b.headers.forEach(v=>node('th',v,tr));const body=node('tbody',undefined,tab);for(const row of b.rows){const r=node('tr',undefined,body);row.forEach(v=>node('td',v,r))}}}node('h2','확인 문제',a);for(const q of x.reviewQuestions){const d=node('details',undefined,a);node('summary',q.prompt,d);node('p',q.answer,d)}const d=node('details',undefined,a);node('summary','본문 전체 지식 항목 ('+x.knowledgeIds.length+'개)',d);const list=node('ol',undefined,d);d.addEventListener('toggle',async()=>{if(d.open&&!list.children.length){try{const k=await get('/mdeet/knowledge/sections/'+x.id.replace('/','--')+'.json');k.items.forEach(v=>node('li',v.text,list))}catch(e){node('li','로딩 오류',list)}}});node('h2','관련 기출 후보',a);node('p','주제 자동 매핑 후보이며 정확한 연관성은 검수 전입니다.',a).className='meta';const l=node('div',undefined,a);l.className='links';for(const id of x.relatedQuestionIds){const z=node('a',id,l);z.href='/mdeet/questions/'+id+'.json';z.target='_blank';z.rel='noopener'}if(!x.relatedQuestionIds.length)node('p','세부 절 연결 후보 없음. 단원 전체 기출은 문제 은행에서 확인.',a)}catch(e){a.textContent='학습 자료 로드 실패: '+e.message}}(async()=>{try{data=await get('/mdeet/textbook/index.json');for(const b of data.books)$('book').add(new Option(b.title,b.id));$('book').onchange=nav;$('search').oninput=nav;nav();if(data.sections.length)openSection(data.sections[0])}catch(e){$('content').textContent='목차 로드 실패: '+e.message}})();</script></body></html>
